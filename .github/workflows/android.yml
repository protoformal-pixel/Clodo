# Builds the Android app (an .apk) with Capacitor on every push.
#
# - Every build: the .apk is attached to the run, under "Artifacts" on the
#   Actions page.
# - Pushes to main: also published on the Releases page as "Android test
#   build", with a fixed download link for phones:
#   https://github.com/protoformal-pixel/Clodo/releases/download/android-latest/Calculator.apk
name: Android app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write # to publish the test build on the Releases page

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Copy the web app into the Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          version=$(node -p "require('./package.json').version")
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" "Calculator-$version-build$BUILD_NUMBER.apk"
          cp "$apk" Calculator.apk
          ls -l Calculator*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-android-build${{ github.run_number }}
          path: Calculator-*-build*.apk

      - name: Publish the test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Calculator.apk "Calculator-$version-build$BUILD_NUMBER.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android test build $version ($BUILD_NUMBER)" \
            --notes "Test build of the calculator for Android, from commit $GITHUB_SHA.

          On your phone, download **Calculator.apk** and open it. Android will ask to allow installing apps from your browser; allow it for this install.

          Each new test build installs over the previous one and keeps your data."
