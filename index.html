<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <meta name="description" content="A simple calculator with scientific functions and history." />
    <meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <div class="top-bar">
        <div class="toggles">
          <button id="sci-toggle" class="chip" aria-pressed="false">Sci</button>
          <button id="history-toggle" class="chip" aria-pressed="false">
            History
          </button>
          <button id="graph-toggle" class="chip" aria-pressed="false">Graph</button>
          <button id="stat-toggle" class="chip" aria-pressed="false">Stat</button>
        </div>
        <span id="mode" class="mode"></span>
      </div>
      <section class="graph" id="graph" aria-label="Graph" hidden>
        <ol class="fn-list" id="fn-list"></ol>
        <div class="fn-tools" id="fn-tools" hidden>
          <button data-insert="x" class="x-key" title="The variable x">x</button>
          <button id="fn-backspace" class="backspace" aria-label="Delete" title="Delete">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z" />
              <path d="M12 9.5l5 5M17 9.5l-5 5" />
            </svg>
          </button>
          <button id="fn-done" class="chip done">Draw</button>
        </div>
        <div class="plot" id="plot">
          <canvas id="graph-canvas" class="graph-canvas" role="img"
            aria-label="Graph of the functions above"></canvas>
          <div class="graph-toolbar">
            <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
            <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
            <button id="zoom-std" title="x from −10 to 10">Std</button>
            <button id="zoom-trig" title="Two full turns across">Trig</button>
            <button id="graph-angle" title="Angle unit for sin, cos and tan">Deg</button>
            <button id="table-toggle" aria-pressed="false">Table</button>
          </div>
          <div class="graph-toolbar gsolv" id="gsolv" aria-label="Analyse the graph">
            <button data-solve="root" title="Where the curve crosses y = 0">Root</button>
            <button data-solve="min" title="Lowest point">Min</button>
            <button data-solve="max" title="Highest point">Max</button>
            <button data-solve="isect" title="Where two curves meet">Isect</button>
            <button data-solve="integral" title="Area between two x values">∫dx</button>
          </div>
          <div class="solve-result" id="solve-result" aria-live="polite" hidden></div>
          <p class="trace" id="trace" aria-live="polite"></p>
          <div class="table-wrap" id="table-wrap" hidden>
            <table class="value-table" id="value-table"></table>
          </div>
        </div>
      </section>
      <section class="stat" id="stat" aria-label="Statistics" hidden>
        <div class="data-wrap" id="data-wrap">
          <table class="data-table">
            <thead>
              <tr><th scope="col">#</th><th scope="col">x</th><th scope="col">y</th></tr>
            </thead>
            <tbody id="data-body"></tbody>
          </table>
        </div>
        <div class="fn-tools" id="stat-tools" hidden>
          <button id="cell-backspace" class="backspace" aria-label="Delete" title="Delete">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z" />
              <path d="M12 9.5l5 5M17 9.5l-5 5" />
            </svg>
          </button>
          <button id="cell-next" class="chip next">Next ↵</button>
          <button id="cell-done" class="chip done">Done</button>
        </div>
        <div class="stat-results" id="stat-results">
          <div class="graph-toolbar" id="model-picker" role="group" aria-label="Regression model">
            <button data-model="lin" title="y = a + bx">Lin</button>
            <button data-model="quad" title="y = a + bx + cx²">Quad</button>
            <button data-model="log" title="y = a + b·ln x">Log</button>
            <button data-model="exp" title="y = a·e^(bx)">Exp</button>
            <button data-model="pow" title="y = a·x^b">Pow</button>
          </div>
          <div class="regression" id="regression" aria-live="polite"></div>
          <div class="summary" id="summary"></div>
          <p class="stat-hint">Tap a value to use it in the calculator.</p>
          <div class="stat-actions">
            <button id="clear-data" class="link">Clear data</button>
          </div>
        </div>
      </section>
      <div class="screen" id="screen">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output class="display" id="display" aria-live="polite">0</output>
      <div class="edit-row">
        <span id="preview" class="preview" aria-live="polite"></span>
        <button id="sd" class="sd" title="Fraction ⇔ decimal (f)"
          aria-label="Switch between fraction, mixed number and decimal">S⇔D</button>
        <button id="backspace" class="backspace" aria-label="Delete" title="Delete">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z" />
            <path d="M12 9.5l5 5M17 9.5l-5 5" />
          </svg>
        </button>
      </div>
      </div>
      <div class="sci" id="sci" hidden>
        <div class="angle" role="group" aria-label="Angle unit">
          <button data-angle="deg" aria-pressed="true">Deg</button>
          <button data-angle="rad" aria-pressed="false">Rad</button>
        </div>
        <div class="sci-keys">
          <button id="inv" aria-pressed="false" title="Inverse functions">
            Inv
          </button>
          <button data-insert="sin(" data-inv-insert="sin⁻¹(" data-inv-label="sin⁻¹">
            sin
          </button>
          <button data-insert="cos(" data-inv-insert="cos⁻¹(" data-inv-label="cos⁻¹">
            cos
          </button>
          <button data-insert="tan(" data-inv-insert="tan⁻¹(" data-inv-label="tan⁻¹">
            tan
          </button>

          <button data-insert="²" data-inv-insert="√(" data-inv-label="√">x²</button>
          <button data-insert="^" data-inv-insert="root" data-inv-label="ʸ√x">
            xʸ
          </button>
          <button data-insert="ln(" data-inv-insert="e^(" data-inv-label="eˣ">ln</button>
          <button data-insert="log(" data-inv-insert="10^(" data-inv-label="10ˣ">
            log
          </button>

          <button data-insert="⁻¹">x⁻¹</button>
          <button data-insert="!">n!</button>
          <button data-insert="π">π</button>
          <button data-insert="e">e</button>

          <button data-insert="neg" title="Negative number">(−)</button>
          <button data-insert="%">%</button>
          <button data-insert="Abs(" title="Absolute value">|x|</button>
          <button data-insert="Ans" title="Last answer">Ans</button>
        </div>
        <div class="calc-keys">
          <button data-insert="∫(" title="Integral: ∫(f(x), from, to)">∫dx</button>
          <button data-insert="d/dx(" title="Slope: d/dx(f(x), at x)">d/dx</button>
          <button data-insert="Solve(" title="Solve f(x) = 0: Solve(f(x), start)">Solve</button>
          <button data-insert="," title="Separates values">,</button>
          <button data-insert="x" class="x-key" title="The variable x">x</button>
        </div>
        <div class="memory" aria-label="Memory">
          <div class="memory-header">
            <span>Memory</span>
            <button id="clear-memory" class="link" hidden>Clear</button>
          </div>
          <div class="memory-keys">
          <button id="sto" aria-pressed="false" title="Store in a letter">STO</button>
          <button data-insert="A" data-var="A" aria-label="Memory A">
            <span class="var-name">A</span><span class="var-value">0</span>
          </button>
          <button data-insert="B" data-var="B" aria-label="Memory B">
            <span class="var-name">B</span><span class="var-value">0</span>
          </button>
          <button data-insert="C" data-var="C" aria-label="Memory C">
            <span class="var-name">C</span><span class="var-value">0</span>
          </button>
          <button data-insert="D" data-var="D" aria-label="Memory D">
            <span class="var-name">D</span><span class="var-value">0</span>
          </button>
          <button data-insert="E" data-var="E" aria-label="Memory E">
            <span class="var-name">E</span><span class="var-value">0</span>
          </button>
          <button data-insert="F" data-var="F" aria-label="Memory F">
            <span class="var-name">F</span><span class="var-value">0</span>
          </button>
          </div>
        </div>
      </div>
      <div class="keys">
        <button data-action="clear" class="fn">AC</button>
        <button data-insert="(" class="fn">(</button>
        <button data-insert=")" class="fn">)</button>
        <button data-insert="/" class="op" aria-label="divide">÷</button>

        <button data-insert="7">7</button>
        <button data-insert="8">8</button>
        <button data-insert="9">9</button>
        <button data-insert="*" class="op" aria-label="multiply">×</button>

        <button data-insert="4">4</button>
        <button data-insert="5">5</button>
        <button data-insert="6">6</button>
        <button data-insert="-" class="op" aria-label="subtract">−</button>

        <button data-insert="1">1</button>
        <button data-insert="2">2</button>
        <button data-insert="3">3</button>
        <button data-insert="+" class="op" aria-label="add">+</button>

        <button data-insert="0" class="wide">0</button>
        <button data-insert=".">.</button>
        <button data-action="equals" class="op">=</button>
      </div>
      <section class="history" id="history" aria-label="History" hidden>
        <div class="history-header">
          <h2>History</h2>
          <button id="clear-history" class="link" hidden>Clear</button>
        </div>
        <p id="history-empty" class="history-empty">No calculations yet</p>
        <ol id="history-list" class="history-list"></ol>
      </section>
    </main>
    <script src="calculus.js"></script>
    <script src="calculator.js"></script>
    <script src="graph.js"></script>
    <script src="stats.js"></script>
    <script src="app.js"></script>
  </body>
</html>
