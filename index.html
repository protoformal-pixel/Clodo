<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <meta name="description" content="A simple calculator with scientific functions and history." />
    <meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <div class="top-bar">
        <div class="toggles">
          <button id="sci-toggle" class="chip" aria-pressed="false">Sci</button>
          <button id="history-toggle" class="chip" aria-pressed="false">
            History
          </button>
        </div>
        <span id="mode" class="mode"></span>
      </div>
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output class="display" id="display" aria-live="polite">0</output>
      <div class="edit-row">
        <button id="backspace" class="backspace" aria-label="Delete" title="Delete">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z" />
            <path d="M12 9.5l5 5M17 9.5l-5 5" />
          </svg>
        </button>
      </div>
      <div class="sci" id="sci" hidden>
        <div class="angle" role="group" aria-label="Angle unit">
          <button data-angle="deg" aria-pressed="true">Deg</button>
          <button data-angle="rad" aria-pressed="false">Rad</button>
        </div>
        <div class="sci-keys">
          <button id="inv" aria-pressed="false" title="Inverse functions">
            Inv
          </button>
          <button data-fn="sin" data-inv-fn="asin" data-inv-label="sin⁻¹">
            sin
          </button>
          <button data-fn="cos" data-inv-fn="acos" data-inv-label="cos⁻¹">
            cos
          </button>
          <button data-fn="tan" data-inv-fn="atan" data-inv-label="tan⁻¹">
            tan
          </button>

          <button data-fn="square" data-inv-fn="sqrt" data-inv-label="√x">
            x²
          </button>
          <button data-operator="^" data-inv-operator="root" data-inv-label="ʸ√x">
            xʸ
          </button>
          <button data-fn="ln" data-inv-fn="exp" data-inv-label="eˣ">ln</button>
          <button data-fn="log" data-inv-fn="pow10" data-inv-label="10ˣ">
            log
          </button>

          <button data-fn="reciprocal">1/x</button>
          <button data-fn="factorial">n!</button>
          <button data-constant="pi">π</button>
          <button data-constant="e">e</button>
        </div>
      </div>
      <div class="keys">
        <button data-action="clear" class="fn">AC</button>
        <button data-action="sign" class="fn">±</button>
        <button data-action="percent" class="fn">%</button>
        <button data-operator="/" class="op" aria-label="divide">÷</button>

        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button data-operator="*" class="op" aria-label="multiply">×</button>

        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button data-operator="-" class="op" aria-label="subtract">−</button>

        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button data-operator="+" class="op" aria-label="add">+</button>

        <button data-digit="0" class="wide">0</button>
        <button data-action="decimal">.</button>
        <button data-action="equals" class="op">=</button>
      </div>
      <section class="history" id="history" aria-label="History" hidden>
        <div class="history-header">
          <h2>History</h2>
          <button id="clear-history" class="link" hidden>Clear</button>
        </div>
        <p id="history-empty" class="history-empty">No calculations yet</p>
        <ol id="history-list" class="history-list"></ol>
      </section>
    </main>
    <script src="calculator.js"></script>
    <script src="app.js"></script>
  </body>
</html>
